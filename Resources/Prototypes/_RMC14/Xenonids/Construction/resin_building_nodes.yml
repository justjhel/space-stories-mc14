- type: entity
  id: XenoResinBuildingNode
  parent: DesignNodeMarkBase
  name: resin building designation
  description: A psychic mark reserving a location for future resin construction.
  categories: [ HideSpawnMenu, DoNotMap ]
  save: false
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/designer_nodes.rsi
    state: wall_mark_construct
  - type: XenoResinBuildingNode

- type: entity
  id: XenoResinBuildingQueenQueueNode
  parent: XenoResinBuildingNode
  name: queued resin construction
  description: A golden psychic mark in the Queen's construction queue.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/designer_nodes.rsi
    state: wall_mark_construct
    color: "#FFD700"
